[build]
# T-Embed board adapter (W6): the firmware target moves from the old
# HUZZAH32 prototype's xtensa-esp32-espidf to the T-Embed's ESP32-S3,
# xtensa-esp32s3-espidf. This only affects `firmware`/the `esp32` binary;
# the host/emulator build (`-p emulator`, `--bin desktop`) resolves to the
# host triple regardless of this default and is unaffected.
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU="esp32s3"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v5.3.3"
LDPROXY_LINKER="xtensa-esp32s3-elf-gcc"
