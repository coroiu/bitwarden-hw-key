[package]
name = "firmware"
version = "0.1.0"
authors = ["Andreas Coroiu <andreas.coroiu@gmail.com>"]
edition = "2021"
rust-version = "1.77"

# This crate only ever targets xtensa-esp32-espidf (see the workspace-root
# .cargo/config.toml default and rust-toolchain.toml). Unlike the old
# single-crate setup, dependencies here don't need `cfg(target_arch =
# "xtensa")` gating: this package IS the ESP32 side of the portability
# split, so esp-idf-hal/esp-idf-svc are unconditional dependencies. `cargo
# build --bin desktop` / `-p emulator` never touches this package's
# dependency graph at all.

[features]
default = ["std", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = [
  "esp-idf-svc/embassy-sync",
  "esp-idf-svc/critical-section",
  "esp-idf-svc/embassy-time-driver",
]

[dependencies]
bhk-core = { path = "../core" }
log = { version = "0.4", default-features = false }
once_cell = "1.19.0"
uuid = { version = "1.8.0", features = ["v4"] }
embedded-graphics-core = "0.4.0"
embedded-graphics = "0.8.1"
esp-idf-svc = { version = "0.51", default-features = false }
esp-idf-hal = "0.45"
# `embedded_svc::storage::RawStorage` (get_raw/set_raw/len) is what
# `board::nvs_storage::NvsStorage` uses against `EspNvs`. Pinned to the
# same 0.28 esp-idf-svc 0.51 already depends on, so Cargo resolves both
# to the same crate instance instead of two incompatible trait copies.
embedded-svc = { version = "0.28", default-features = false }
# T-Embed (ESP32-S3) board adapter, W6: real ST7789 panel driver and
# rotary-encoder quadrature decoder. See `board/` for the trait impls.
mipidsi = "0.10"
rotary-encoder-hal = "0.6"
# Old HUZZAH32 (plain ESP32) prototype: SSD1306 OLED + 3-button GPIO
# input. Kept only until the T-Embed board adapter has proven parity in
# the unified main loop (W7), per the M0 epic; not used by `board/`.
ssd1306 = "0.8.4"
# `board::rotary_input` reuses this for the encoder's push-button
# (debounce/click/long-press) instead of hand-rolling it again. The
# original `esp_input.rs` enabled only "esp"/"std" and worked around the
# missing blanket `PinWrapper` impl with its own `MyPinWrapper` + `Box<dyn
# _>` boilerplate (see that file) — "esp" only pulls in the `embedded-hal`
# dependency, it does not gate button-driver's `impl<P: InputPin>
# PinWrapper for P` (that's behind the separate "embedded_hal" feature
# name). Adding "embedded_hal" here lets `board::rotary_input` use
# `esp_idf_hal::gpio::PinDriver` directly as a `PinWrapper` with no
# wrapper type.
button-driver = { version = "0.2", features = ["esp", "std", "embedded_hal"] }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
build-target = "0.8.0"

[[bin]]
name = "esp32"
path = "src/main.rs"
