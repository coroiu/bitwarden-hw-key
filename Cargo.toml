[package]
name = "bitwarden-hw-key"
version = "0.1.0"
authors = ["Andreas Coroiu <andreas.coroiu@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.71"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["std", "embassy", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = [
  "esp-idf-svc/embassy-sync",
  "esp-idf-svc/critical-section",
  "esp-idf-svc/embassy-time-driver",
]

[dependencies]
log = { version = "0.4", default-features = false }
once_cell = "1.19.0"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
embedded-graphics-core = "0.4.0"
embedded-graphics = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"

# ESP32-specific dependencies
[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-idf-svc = { version = "0.51", default-features = false }
esp-idf-hal = "0.45"
ssd1306 = "0.8.4"
button-driver = { version = "0.2", features = ["esp", "std"] }

# Desktop-specific dependencies
[target.'cfg(not(target_arch = "xtensa"))'.dependencies]
minifb = "0.27"
tiny_http = "0.12"
chrono = "0.4"

[build-dependencies]
embuild = "0.31.3"

[[bin]]
name = "esp32"
path = "src/main.rs"

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
