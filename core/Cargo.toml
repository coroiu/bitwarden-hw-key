[package]
name = "bhk-core"
version = "0.1.0"
authors = ["Andreas Coroiu <andreas.coroiu@gmail.com>"]
edition = "2021"
rust-version = "1.77"

# Platform-free application core. This crate MUST NOT depend on esp-idf-*,
# minifb, tiny_http, ssd1306, or any other platform-specific crate. That
# constraint is enforced by the absence of such dependencies below, not by
# convention: if a platform crate ever creeps in here, both `firmware` and
# `emulator` still build against this same code, so drift becomes visible
# immediately instead of failing silently on one target.
#
# See: .planning/decisions/2026-08-11-portability-boundary-and-workspace-split.md

[dependencies]
embedded-graphics = "0.8.2"
embedded-graphics-framebuf = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
u8g2-fonts = { version = "0.5.2", features = ["embedded_graphics_textstyle"] }
uuid = { version = "1.8.0", features = ["v4"] }
# Only pulled in by the off-by-default "frame-timing" feature (see
# [features] below) -- this crate otherwise has no logging dependency,
# per its "platform-free" doc comment above (log's facade is trivially
# portable, but there's no reason to pay even that for a diagnostic
# feature nobody's using).
log = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"] }

[features]
# TEMPORARY diagnostic aid (bead ai-bitwarden-hw-key-ego), OFF by
# default: logs per-frame render/flush timing and a rolling-average FPS
# in `run::run`'s loop, to measure where the ~33ms frame budget actually
# goes on real hardware (render? flush/SPI? something else?) rather than
# guessing. See `run.rs`'s `FrameTiming` for the exact measurement
# points. Not meant to be a permanent feature -- revisit once the
# refresh-rate investigation concludes.
frame-timing = ["dep:log"]
