[package]
name = "web-companion"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately its own top-level [workspace] (see rust-toolchain.toml note
# below): this stops Cargo's upward directory walk at this crate, so it is
# NOT swept into the root repo's xtensa/esp workspace, and the root workspace
# never tries to build it either (see root Cargo.toml `exclude`).
#
# Feasibility-gate spike for the web-companion epic (Ada design,
# ai-bitwarden-hw-key-eml.1): PROVE that the Bitwarden PM SDK crate set
# (bitwarden/sdk-internal, git dep) resolves and links on a host stable
# toolchain from inside this repo, without touching the esp/xtensa root
# workspace. No credentials, no runtime login — build/link/compile only.
[workspace]
members = ["."]

[dependencies]
# Cross-workspace path dep into the sibling wire-format crate (root workspace
# member). Confirmed this pulls in ONLY push-protocol + its own deps
# (serde/ciborium/uuid), not bhk-core/firmware/emulator/esp-idf — see
# ai-bitwarden-hw-key-eml.1 report for the pollution check.
push-protocol = { path = "../push-protocol" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
# "serde" so `Uuid` (used directly in the `/api/vault/list` metadata DTO,
# ai-bitwarden-hw-key-eml.4) can derive through `Serialize`. Already enabled
# transitively via push-protocol's `uuid` feature set (same resolved crate
# version, Cargo feature-unifies across the workspace), but named explicitly
# here so this crate's own need for it isn't hidden behind another crate's
# Cargo.toml.
uuid = { version = "1", features = ["v4", "serde"] }

# axum server skeleton (ai-bitwarden-hw-key-eml.2): "fs" enables
# tower_http::services::ServeDir for the static UI assets.
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs"] }

# Auth API (ai-bitwarden-hw-key-eml.3): request/response DTOs for
# /api/auth/*. Already pulled in transitively by bitwarden-core/axum, but
# depended on directly since our own DTOs derive Serialize/Deserialize.
serde = { version = "1", features = ["derive"] }
# zeroize the stashed master password held across a login -> 2FA round
# trip (see web-companion/src/state.rs `PendingTwoFactorLogin`). Already
# pulled in transitively by bitwarden-crypto; depended on directly since we
# construct `Zeroizing<String>` ourselves.
zeroize = "1"

# All pinned to ONE commit of bitwarden/sdk-internal (see rev below).
# bitwarden-collections is pulled in transitively by bitwarden-core/
# bitwarden-vault; this build did not need to depend on it directly.
# bitwarden-crypto WAS transitive-only through eml.3, but eml.4 (vault
# read) calls `KeyStore<KeySlotIds>::decrypt` and names `CryptoError`
# directly (see src/vault.rs), so it is now a direct dependency too.
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal", rev = "99ffb6ef5f07c1b344f0e8ceb4da37f27482e9f6", features = [
    "internal",
] }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "99ffb6ef5f07c1b344f0e8ceb4da37f27482e9f6" }
bitwarden-sync = { git = "https://github.com/bitwarden/sdk-internal", rev = "99ffb6ef5f07c1b344f0e8ceb4da37f27482e9f6" }
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "99ffb6ef5f07c1b344f0e8ceb4da37f27482e9f6" }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "99ffb6ef5f07c1b344f0e8ceb4da37f27482e9f6" }

# `bitwarden_sync::SyncHandler` is defined with `#[async_trait::async_trait]`
# (see sdk-internal crates/bitwarden-sync/src/handler.rs) -- external
# implementors (our `CipherCaptureHandler` in src/vault.rs) apply the same
# macro to their `impl` block so the desugared signatures match. Pinned to
# the same version the SDK itself uses (Cargo.lock @ 99ffb6ef) though any
# semver-compatible 0.1 release would produce an identical expansion.
async-trait = "0.1"

# CBOR-encodes the outbound `push_protocol::SyncRequest` body in
# `crate::transport::HttpEmulatorTransport::push` (ai-bitwarden-hw-key-eml.5)
# -- the same wire format the retired `companion` binary used and the
# emulator's `/api/sync` (`ciborium::from_reader`) still expects. Already
# resolved transitively (push-protocol depends on it); named directly here
# since this crate's own code calls `ciborium::into_writer`.
ciborium = "0.2"

# Async HTTP client for `crate::transport::HttpEmulatorTransport::push`
# (ai-bitwarden-hw-key-eml.5) -- the async port of the retired `companion`
# binary's synchronous `ureq::post` push. Already resolved at 0.13.4
# transitively (a dependency of the pinned bitwarden-sdk-internal crates);
# promoted to a direct dependency here since this crate's own code calls
# `reqwest::Client` directly. "json" enables `Response::json()`, used to
# decode the device's `SyncResponse` reply.
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# Installs the process-wide rustls `CryptoProvider` (see
# `crate::transport::ensure_crypto_provider_installed`) -- the transitive
# `reqwest`/`hyper-rustls` stack already resolves with rustls's "ring"
# feature active (confirmed: `Cargo.lock`'s `rustls` entry depends on `ring`,
# not `aws-lc-rs`), but reqwest 0.13's `rustls-no-provider` posture (also
# already active transitively) means NOTHING installs a default
# `CryptoProvider` automatically -- `reqwest::Client::new()` panics at
# construction time until one is. This was a latent gap even before this
# bead (the bitwarden SDK's own login path builds a `reqwest::Client` too),
# just never exercised by a non-`#[ignore]`d test until this bead's
# `push_to_unreachable_device_is_a_clean_error`/`connect_to_known_id_succeeds`
# tests were the first in this crate to actually construct+use one.
# `default-features = false` + `features = ["ring"]` matches the feature
# already active in the resolved graph -- promoting it to a direct
# dependency does not change resolution (verified: no new packages, no
# version bumps).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
# In-process router testing (tower::ServiceExt::oneshot) without binding a
# real socket — see the `tests` module in src/main.rs.
http-body-util = "0.1"
# JSON (de)serialization round-trip tests for the auth API DTOs (see
# src/auth_routes.rs `tests` module).
serde_json = "1"
# Constructing `CipherView` fixtures in src/vault.rs unit tests
# (`creation_date`/`revision_date: DateTime<Utc>`). Already pulled in
# transitively by bitwarden-sync; depended on directly since test code
# constructs `Utc::now()` itself.
chrono = "0.4"
